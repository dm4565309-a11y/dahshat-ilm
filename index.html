<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دهشة علم — نادي التجارب والابتكارات الطلابية</title>
<meta name="description" content="نادي دهشة علم للتجارب والابتكارات الطلابية: أعمال الطلبة وأخبار النادي.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&amp;family=Tajawal:wght@400;500;700;800&amp;display=swap">
<style id="dh-css">
/* Layout: sticky header, deep hero panel, card grids for works and news, modal dialogs for details, forms and "about". */
:root{
  --surface-100:#f7f4ec;--surface-200:#efeadd;--surface-raised:#ffffff;
  --ink:#1b2430;--ink-muted:#5a6472;--line:#ddd6c6;--line-strong:#8c8577;
  --teal:#0f6e6a;--on-teal:#ffffff;--teal-soft:#d9ecea;
  --spark:#f2b134;--on-spark:#1b2430;--spark-soft:#fbecc8;--spark-ink:#7a4f00;
  --coral:#c8432c;--on-coral:#ffffff;--coral-soft:#f8ddd6;--coral-ink:#a3301c;
  --deep:#13343b;--on-deep:#f7f4ec;--focus:#0f6e6a;--scrim:rgba(12,22,26,.55);
  --shadow-card:0 1px 2px rgba(27,36,48,.06),0 6px 18px rgba(27,36,48,.06);
  --shadow-pop:0 24px 60px rgba(19,52,59,.22);
  --font-display:"El Messiri","Tajawal",system-ui,sans-serif;
  --font-sans:"Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--space-8:32px;--space-12:48px;
  --radius-sm:8px;--radius-md:14px;--radius-lg:24px;--radius-pill:999px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --surface-100:#12171d;--surface-200:#1c232b;--surface-raised:#1a2129;
  --ink:#eef1ee;--ink-muted:#a3adb8;--line:#2e3843;--line-strong:#6b7684;
  --teal:#4fc2b9;--on-teal:#0b1a1a;--teal-soft:#183b3a;
  --spark:#f5c25a;--on-spark:#1b2430;--spark-soft:#3a3016;--spark-ink:#f5c25a;
  --coral:#f07a62;--on-coral:#1b0f0c;--coral-soft:#3d211b;--coral-ink:#f07a62;
  --deep:#1f4a52;--on-deep:#eef1ee;--focus:#f5c25a;--scrim:rgba(0,0,0,.65);
  --shadow-card:0 1px 2px rgba(0,0,0,.4);--shadow-pop:0 24px 60px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --surface-100:#12171d;--surface-200:#1c232b;--surface-raised:#1a2129;
  --ink:#eef1ee;--ink-muted:#a3adb8;--line:#2e3843;--line-strong:#6b7684;
  --teal:#4fc2b9;--on-teal:#0b1a1a;--teal-soft:#183b3a;
  --spark:#f5c25a;--on-spark:#1b2430;--spark-soft:#3a3016;--spark-ink:#f5c25a;
  --coral:#f07a62;--on-coral:#1b0f0c;--coral-soft:#3d211b;--coral-ink:#f07a62;
  --deep:#1f4a52;--on-deep:#eef1ee;--focus:#f5c25a;--scrim:rgba(0,0,0,.65);
  --shadow-card:0 1px 2px rgba(0,0,0,.4);--shadow-pop:0 24px 60px rgba(0,0,0,.6);
  color-scheme:dark}
html,body{background:var(--surface-100);margin:0}
img,video{max-width:100%}
[hidden]{display:none!important}
body{color:var(--ink);font-family:var(--font-sans);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
*,*::before,*::after{box-sizing:border-box}
#app{min-height:100vh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:1200px;margin-inline:auto;padding-inline:var(--space-8)}
h1,h2,h3{text-wrap:balance}
a{color:inherit}
button{font:inherit;color:inherit}
.ic{flex:none;display:block}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* buttons */
.btn{font-size:14px;font-weight:700;line-height:20px;display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);min-height:42px;padding:0 18px;border-radius:var(--radius-md);border:1px solid transparent;cursor:pointer;white-space:nowrap;text-decoration:none;transition:box-shadow .15s,transform .15s,background .15s}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--teal);color:var(--on-teal)}
.btn-primary:hover{box-shadow:inset 0 0 0 100px rgba(0,0,0,.1)}
.btn-spark{background:var(--spark);color:var(--on-spark)}
.btn-spark:hover{box-shadow:inset 0 0 0 100px rgba(0,0,0,.07)}
.btn-quiet{background:var(--surface-raised);color:var(--ink);border-color:var(--line-strong)}
.btn-quiet:hover{background:var(--surface-200)}
.btn-ghost{background:transparent;color:var(--ink)}
.btn-ghost:hover{background:var(--surface-200)}
.btn-danger{background:transparent;color:var(--coral-ink);border-color:var(--coral)}
.btn-danger:hover{background:var(--coral-soft)}
.btn-ondeep{background:transparent;color:var(--on-deep);border-color:var(--on-deep)}
.btn-ondeep:hover{background:rgba(255,255,255,.08)}
.btn-icon{width:42px;padding:0}
.btn-sm{min-height:34px;padding:0 12px;font-size:13px}
.btn-sm.btn-icon{width:34px;padding:0}

/* badges & segmented */
.badge{display:inline-flex;align-items:center;gap:var(--space-1);font-size:12.5px;line-height:18px;font-weight:700;padding:3px 10px;border-radius:var(--radius-pill);background:var(--surface-200);color:var(--ink);width:max-content;max-width:100%}
.b-teal{background:var(--teal-soft);color:var(--teal)}
.b-spark{background:var(--spark-soft);color:var(--spark-ink)}
.b-coral{background:var(--coral-soft);color:var(--coral-ink)}
.b-ink{background:var(--deep);color:var(--on-deep)}
.b-example{background:transparent;color:var(--ink-muted);border:1px dashed var(--line-strong);padding:2px 9px}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--surface-200);border-radius:var(--radius-lg);border:1px solid var(--line);max-width:100%}
.seg button{font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 14px;border:0;border-radius:var(--radius-pill);background:transparent;color:var(--ink-muted);cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface-raised);color:var(--teal);box-shadow:var(--shadow-card)}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface-raised);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:var(--space-6);padding-block:var(--space-3)}
.logo{display:flex;align-items:center;gap:var(--space-3);text-decoration:none;color:var(--ink);flex:none}
.logo-mark{width:44px;height:44px;border-radius:var(--radius-md);background:var(--deep);color:var(--spark);display:grid;place-items:center;position:relative}
.logo-mark::after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:var(--spark);top:-3px;left:-3px;box-shadow:0 0 0 3px var(--surface-raised)}
.logo-text{font-family:var(--font-display);font-size:24px;line-height:28px;font-weight:700;display:flex;flex-direction:column}
.logo-text small{font-family:var(--font-sans);font-size:12px;line-height:16px;font-weight:500;color:var(--ink-muted)}
.nav{display:flex;gap:var(--space-1);flex:1;min-width:0}
.nav a{font-size:15px;font-weight:700;text-decoration:none;color:var(--ink-muted);padding:10px 14px;border-radius:var(--radius-sm);position:relative;white-space:nowrap}
.nav a:hover{color:var(--ink);background:var(--surface-200)}
.nav a[aria-current="page"]{color:var(--teal)}
.nav a[aria-current="page"]::after{content:"";position:absolute;inset-inline:14px;bottom:3px;height:3px;border-radius:3px;background:var(--spark)}
.hdr-actions{display:flex;align-items:center;gap:var(--space-2)}
.info-btn{width:44px;height:44px;border-radius:var(--radius-pill);border:1px solid var(--line-strong);background:var(--surface-raised);color:var(--teal);display:grid;place-items:center;cursor:pointer}
.info-btn:hover{background:var(--teal-soft)}
.admin-on{background:var(--deep);color:var(--on-deep);border-color:var(--deep)}

/* admin strip */
.admin-strip{background:var(--deep);color:var(--on-deep);font-size:14px}
.admin-strip .wrap{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;padding-block:var(--space-2)}
.admin-strip strong{color:var(--spark)}
.admin-strip .grow{flex:1;min-width:200px}
.meter{display:inline-flex;align-items:center;gap:var(--space-2);font-size:13px;opacity:.9}
.meter i{display:block;width:90px;height:6px;border-radius:6px;background:rgba(255,255,255,.2);overflow:hidden}
.meter i b{display:block;height:100%;background:var(--spark)}

/* hero */
.hero{margin-top:var(--space-6);border-radius:var(--radius-lg);background:var(--deep);color:var(--on-deep);display:grid;grid-template-columns:1.3fr 1fr;overflow:hidden}
.hero-text{padding:var(--space-12);display:flex;flex-direction:column;justify-content:center;gap:var(--space-4);min-width:0}
.eyebrow{display:inline-flex;align-items:center;gap:var(--space-2);color:var(--spark);font-size:14px;font-weight:700}
.hero h1{margin:0;font-family:var(--font-display);font-size:clamp(34px,5vw,52px);line-height:1.22;font-weight:700}
.hero p{margin:0;font-size:17px;line-height:1.7;opacity:.92;max-width:46ch}
.hero-cta{display:flex;gap:var(--space-3);flex-wrap:wrap;padding-top:var(--space-2)}
.hero-art{position:relative;min-height:220px}
.hero-art svg{position:absolute;inset:0;width:100%;height:100%}
.hero-stats{display:flex;gap:var(--space-6);flex-wrap:wrap;padding-top:var(--space-2);font-size:13px;opacity:.9}
.hero-stats strong{display:block;font-family:var(--font-display);font-size:26px;line-height:1.2;color:var(--spark);font-variant-numeric:tabular-nums}

/* sections */
main{flex:1}
.section{padding-block:var(--space-12)}
.section-alt{background:var(--surface-200)}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap;margin-bottom:var(--space-6)}
.sec-head h2{margin:0;font-family:var(--font-display);font-size:clamp(26px,3.4vw,34px);line-height:1.3;font-weight:700;display:flex;align-items:center;gap:var(--space-3)}
.sec-head h2::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--spark);flex:none}
.sec-sub{margin:-12px 0 var(--space-6);color:var(--ink-muted);font-size:15px}
.tools{display:flex;gap:var(--space-3);flex-wrap:wrap;align-items:center;margin-bottom:var(--space-6)}
.search{display:flex;align-items:center;gap:var(--space-2);background:var(--surface-raised);border:1px solid var(--line-strong);border-radius:var(--radius-pill);padding:0 14px;min-height:44px;flex:1;min-width:200px;max-width:340px;color:var(--ink-muted)}
.search input{border:0;background:transparent;font:inherit;font-size:15px;color:var(--ink);flex:1;min-width:0;outline:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:var(--space-6)}
.more{display:flex;justify-content:center;margin-top:var(--space-6)}

/* cards */
.card{background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s;position:relative;min-width:0}
.card:hover{box-shadow:var(--shadow-card);transform:translateY(-2px)}
.card-hit{position:absolute;inset:0;z-index:1;border:0;background:transparent;cursor:pointer;border-radius:inherit}
.media{position:relative;aspect-ratio:16/10;background:var(--surface-200);overflow:hidden;max-width:100%}
.media img,.media svg{width:100%;height:100%;object-fit:cover;display:block}
.media-tag{position:absolute;top:var(--space-3);inset-inline-start:var(--space-3)}
.card-body{padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-2);flex:1}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);flex-wrap:wrap}
.card-title{margin:0;font-size:19px;line-height:1.5;font-weight:700}
.card-text{margin:0;font-size:14px;line-height:1.65;color:var(--ink-muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{margin-top:auto;padding-top:var(--space-3);border-top:1px solid var(--line);display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--ink-muted);flex-wrap:wrap}
.dot::before{content:"•";margin-inline:4px}
.date{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:500;color:var(--ink-muted)}
.play{position:absolute;inset:0;margin:auto;width:64px;height:64px;border-radius:50%;background:var(--coral);color:var(--on-coral);display:grid;place-items:center;box-shadow:0 0 0 8px rgba(255,255,255,.18)}
.news-link{border-top:6px solid var(--spark)}
.linkrow{margin-top:auto;display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3);border-radius:var(--radius-sm);background:var(--surface-200);border:1px solid var(--line);font-size:14px;font-weight:700;min-width:0}
.linkrow-ic{width:36px;height:36px;border-radius:var(--radius-sm);background:var(--spark);color:var(--on-spark);display:grid;place-items:center;flex:none}
.linkrow-host{flex:1;direction:ltr;text-align:right;color:var(--ink-muted);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.card-admin{position:absolute;top:var(--space-3);inset-inline-end:var(--space-3);z-index:2;display:flex;gap:6px}
.card-admin .btn{background:var(--surface-raised);box-shadow:var(--shadow-card)}

/* art */
.art-ground{fill:var(--teal-soft)}.art-b1{fill:var(--teal);opacity:.9}.art-b2{fill:var(--spark)}
.art-coral .art-ground{fill:var(--coral-soft)}.art-coral .art-b1{fill:var(--coral)}
.art-spark .art-ground{fill:var(--spark-soft)}.art-spark .art-b1{fill:var(--spark)}.art-spark .art-b2{fill:var(--teal)}
.art-deep .art-ground{fill:var(--deep)}.art-deep .art-b1{fill:var(--teal);opacity:.55}.art-deep .art-b2{fill:var(--coral);opacity:.7}
.art-hero .art-ground{fill:transparent}.art-hero .art-b1{fill:var(--teal)}
@media (prefers-reduced-motion:no-preference){
  .art-hero circle{animation:rise 9s ease-in-out infinite alternate}
  .art-hero circle:nth-child(3n){animation-duration:12s}
  .art-hero circle:nth-child(2n){animation-delay:-4s}
  @keyframes rise{from{transform:translateY(4px)}to{transform:translateY(-6px)}}
}

/* empty */
.empty{border:2px dashed var(--line-strong);border-radius:var(--radius-md);padding:var(--space-8);text-align:center;color:var(--ink-muted);display:flex;flex-direction:column;align-items:center;gap:var(--space-3)}
.empty strong{color:var(--ink);font-size:17px}

/* footer */
.ftr{background:var(--deep);color:var(--on-deep);font-size:14px}
.ftr .wrap{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap;padding-block:var(--space-6)}
.ftr span{display:inline-flex;align-items:center;gap:var(--space-2)}
.ftr button{font-weight:700;display:inline-flex;align-items:center;gap:6px;background:transparent;border:0;color:var(--spark);cursor:pointer;padding:6px}

/* modal */
.overlay{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;padding:calc(var(--space-8) + env(safe-area-inset-top,0px)) var(--space-4) var(--space-8);z-index:50;overflow-y:auto}
.modal{background:var(--surface-raised);color:var(--ink);border-radius:var(--radius-lg);box-shadow:var(--shadow-pop);width:100%;max-width:620px;padding:var(--space-8);display:flex;flex-direction:column;gap:var(--space-4);position:relative}
.modal-wide{max-width:820px}
.modal-head{display:flex;align-items:center;gap:var(--space-4)}
.modal-head>div{flex:1;min-width:0}
.modal-head h2{margin:0;font-family:var(--font-display);font-size:24px;line-height:1.35;font-weight:700}
.modal-head p{margin:0;font-size:14px;color:var(--ink-muted)}
.mark{width:56px;height:56px;border-radius:var(--radius-md);background:var(--deep);color:var(--spark);display:grid;place-items:center;flex:none}
.lead{margin:0;font-size:16px;line-height:1.8;white-space:pre-line}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-3)}
.stat{background:var(--surface-200);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);display:flex;flex-direction:column;min-width:0}
.stat strong{font-family:var(--font-display);font-size:28px;line-height:1.3;color:var(--teal);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink-muted)}
.modal h3{margin:var(--space-2) 0 0;font-size:16px;display:flex;align-items:center;gap:var(--space-2)}
.modal h3 .ic{color:var(--teal)}
.goals{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:var(--space-2)}
.goals li{display:flex;gap:var(--space-3);align-items:baseline;font-size:15px;line-height:1.6}
.goals li::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--spark);transform:translateY(1px)}
.about-foot{display:flex;flex-direction:column;gap:var(--space-2);padding-top:var(--space-4);border-top:1px solid var(--line);font-size:14px;color:var(--ink-muted)}
.about-foot span{display:inline-flex;align-items:center;gap:8px}
.sel{user-select:all;direction:ltr;color:var(--ink)}

/* detail */
.gallery{display:flex;flex-direction:column;gap:var(--space-2)}
.gallery-main{border-radius:var(--radius-md);overflow:hidden;background:var(--surface-200);aspect-ratio:16/10;max-width:100%}
.gallery-main img,.gallery-main svg{width:100%;height:100%;object-fit:contain;display:block}
.thumbs{display:flex;gap:var(--space-2);overflow-x:auto;padding-bottom:4px}
.thumbs button{flex:none;width:72px;height:52px;border-radius:var(--radius-sm);overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;background:var(--surface-200)}
.thumbs button[aria-pressed="true"]{border-color:var(--teal)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.detail-meta{display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-4);font-size:14px;color:var(--ink-muted)}
.detail-meta span{display:inline-flex;align-items:center;gap:6px}
.detail-text{margin:0;white-space:pre-line;font-size:16px;line-height:1.85}
.cta-row{display:flex;gap:var(--space-3);flex-wrap:wrap}

/* forms */
.form{display:flex;flex-direction:column;gap:var(--space-4)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span:first-child{font-size:14px;font-weight:700;line-height:20px}
.req{color:var(--coral-ink)}
.hint{font-size:12.5px;line-height:18px;color:var(--ink-muted)}
.input{font:inherit;font-size:15px;color:var(--ink);background:var(--surface-100);border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:10px 12px;width:100%;resize:vertical}
.input::placeholder{color:var(--ink-muted)}
.input[dir="ltr"]{text-align:left}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4)}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:var(--space-6) var(--space-4);border:2px dashed var(--line-strong);border-radius:var(--radius-md);background:var(--surface-200);color:var(--ink-muted);font-size:13px;cursor:pointer;position:relative}
.drop strong{color:var(--ink);font-size:15px}
.drop:hover,.drop.over{border-color:var(--teal)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.drop-ic{width:48px;height:48px;border-radius:50%;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;margin-bottom:4px}
.previews{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.pv{position:relative;width:88px;height:66px;border-radius:var(--radius-sm);overflow:hidden;background:var(--surface-200)}
.pv img{width:100%;height:100%;object-fit:cover;display:block}
.pv button{position:absolute;top:3px;inset-inline-end:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#ffffff;display:grid;place-items:center;cursor:pointer;padding:0}
.pv .cover-tag{position:absolute;bottom:3px;inset-inline-start:3px;font-size:10.5px;font-weight:700;background:var(--spark);color:var(--on-spark);border-radius:4px;padding:0 5px}
.form-foot{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;padding-top:var(--space-2)}
.err{color:var(--coral-ink);font-size:14px;font-weight:700;margin:0}
.note{background:var(--teal-soft);color:var(--ink);border-radius:var(--radius-md);padding:var(--space-4);font-size:14.5px;line-height:1.7}
.note strong{color:var(--teal)}
.confirm{background:var(--coral-soft);border-radius:var(--radius-md);padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)}

.vbox{display:flex;flex-direction:column;gap:var(--space-3);border:1px solid var(--line);border-radius:var(--radius-md);padding:var(--space-4);background:var(--surface-200)}
.vbox-steps strong{display:flex;align-items:center;gap:var(--space-2);font-size:14.5px;color:var(--ink)}
.vbox-steps ol{margin:var(--space-2) 0 var(--space-3);padding-inline-start:1.3em;font-size:13.5px;line-height:1.75;color:var(--ink-muted)}
.vbox-ok{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--teal)}
.vbox-ok.warn{color:var(--spark-ink)}
.upbar{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--teal)}
.upbar i{display:block;height:8px;border-radius:8px;background:var(--teal-soft);overflow:hidden}
.upbar i b{display:block;height:100%;background:var(--teal);transition:width .2s}
.player{width:100%;border-radius:var(--radius-md);background:#000000;display:block;max-height:70vh}
.vprev{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap}
.vprev video{width:180px;border-radius:var(--radius-sm);background:#000000}
.loading{display:flex;align-items:center;justify-content:center;gap:var(--space-3);padding:var(--space-8);color:var(--ink-muted)}
/* toast & busy */
.toast{position:fixed;bottom:calc(var(--space-6) + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--deep);color:var(--on-deep);padding:12px 20px;border-radius:var(--radius-pill);font-weight:700;font-size:14px;z-index:80;box-shadow:var(--shadow-pop);max-width:calc(100% - 32px);text-align:center}
.busy{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:90}
.busy div{background:var(--surface-raised);border-radius:var(--radius-lg);padding:var(--space-6) var(--space-8);display:flex;align-items:center;gap:var(--space-3);font-weight:700}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--teal-soft);border-top-color:var(--teal);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:860px){
  .hdr .wrap{flex-wrap:wrap;gap:var(--space-2) var(--space-3)}
  .nav{order:3;flex-basis:100%;overflow-x:auto;margin-inline:-8px}
  .hdr-actions{margin-inline-start:auto}
  .hero{grid-template-columns:1fr}
  .hero-text{padding:var(--space-8) var(--space-6)}
  .hero-art{min-height:120px;order:-1}
}
@media (max-width:560px){
  .wrap{padding-inline:var(--space-4)}
  .logo-text{font-size:20px}.logo-text small{display:none}
  .up-label{display:none}
  .row2,.stats{grid-template-columns:1fr}
  .modal{padding:var(--space-6) var(--space-4)}
  .section{padding-block:var(--space-8)}
  .stats{grid-template-columns:repeat(3,1fr)}
  .stat{padding:var(--space-2) var(--space-3)}
  .stat strong{font-size:22px}
}
</style>

<body>
<div id="app" dir="rtl" lang="ar"></div>
<script type="application/json" id="dh-data">{"v": 1, "about": {"name": "دهشة علم", "tagline": "نادي التجارب والابتكارات الطلابية", "description": "", "goals": [], "stats": [], "supervisor": "", "meeting": "", "contact": "", "school": ""}, "works": [], "news": []}</script>
<script id="dh-app">
(function(){
"use strict";
var API = "/api";
var FIELDS = {phy:{l:"فيزياء",t:"teal"},chem:{l:"كيمياء",t:"coral"},bio:{l:"أحياء",t:"teal"},robot:{l:"روبوت وبرمجة",t:"spark"},env:{l:"بيئة",t:"teal"},other:{l:"أخرى",t:"spark"}};
var GRADES = ["الخامس","السادس","السابع","الثامن","التاسع","العاشر","الحادي عشر","الثاني عشر"];
var KIND = {image:{l:"صور",t:"teal",i:"image"},video:{l:"فيديو",t:"coral",i:"video"},link:{l:"رابط",t:"spark",i:"link"}};

var state = JSON.parse(document.getElementById("dh-data").textContent);
var ui = {view:"home", field:"all", kind:"all", q:"", admin:false, modal:null, draft:null, busy:false, toast:""};
ui.pin=""; ui.loading=true; ui.up=null;
try { ui.pin = sessionStorage.getItem("dh-pin") || ""; ui.admin = !!ui.pin; } catch(e) {}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function safeUrl(u){try{var x=new URL(String(u||"").trim());return (x.protocol==="https:"||x.protocol==="http:")?x.href:"";}catch(e){return "";}}
function host(u){try{return new URL(u).hostname.replace(/^www\./,"");}catch(e){return "";}}
function isCld(u){return /^https:\/\/res\.cloudinary\.com\/[^"'<>\s]+$/.test(String(u||""));}
function cld(u,t){return String(u).replace("/upload/","/upload/"+t+"/");}
function isCldVideo(u){return isCld(u)&&/\/video\/upload\//.test(u);}
function poster(u){return cld(u,"so_1,w_1200").replace(/\.[a-z0-9]+$/i,".jpg");}
function safeImg(s){s=String(s||"");if(/^data:image\/(jpeg|png|webp|gif);base64,/.test(s))return s;if(isCld(s)&&/\/image\/upload\//.test(s))return cld(s,"f_auto,q_auto,w_1200");return "";}
function thumbImg(s){s=String(s||"");return isCld(s)?cld(s,"f_auto,q_auto,w_300"):safeImg(s);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
var dateFmt; try{dateFmt=new Intl.DateTimeFormat("ar-OM-u-nu-arab",{day:"numeric",month:"long",year:"numeric"});}catch(e){dateFmt=null;}
function fmtDate(s){if(!s)return "";var p=String(s).split("-");var d=new Date(+p[0],(+p[1]||1)-1,+p[2]||1);if(isNaN(d))return esc(s);return esc(dateFmt?dateFmt.format(d):s);}
function byDate(a,b){return String(b.date||"").localeCompare(String(a.date||""));}
function arNum(n){try{return new Intl.NumberFormat("ar-OM-u-nu-arab").format(n);}catch(e){return String(n);}}

var ICONS={info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.6v.4"/>',upload:'<path d="M12 15V4M7 9l5-5 5 5M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>',link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-9 9"/>',video:'<rect x="3" y="5" width="13" height="14" rx="2"/><path d="M16 10l5-3v10l-5-3z"/>',flask:'<path d="M9 3h6M10 3v6l-5.5 9.5A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.5-2.5L14 9V3M7.2 15h9.6"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',arrow:'<path d="M19 12H5M11 6l-6 6 6 6"/>',close:'<path d="M6 6l12 12M18 6L6 18"/>',play:'<path d="M8 5l11 7-11 7z" fill="currentColor" stroke="none"/>',spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M18 6l-2.5 2.5M8.5 15.5L6 18"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14a6.5 6.5 0 0 1 3.5 6"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',lock:'<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',plus:'<path d="M12 5v14M5 12h14"/>',ext:'<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>'};
function ic(n,s){return '<svg class="ic" width="'+(s||20)+'" height="'+(s||20)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[n]||"")+'</svg>';}

var BUB=[[78,22,16],[62,48,8],[86,62,24],[40,30,6],[24,70,12],[52,80,5],[14,34,9],[70,90,7]];
var HERO=[[28,22,13],[66,14,6],[74,52,19],[36,60,9],[16,82,6],[52,84,5],[88,86,7],[48,36,4]];
function art(tone,seed){var set=tone==="hero"?HERO:BUB,s=seed||0,o='<svg class="art-'+tone+'" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect class="art-ground" width="100" height="100"/>';
  set.forEach(function(b,i){o+='<circle class="'+(i%3===0?"art-b2":"art-b1")+'" cx="'+((b[0]+s*17)%100)+'" cy="'+((b[1]+s*11)%100)+'" r="'+b[2]+'"/>';});return o+"</svg>";}
function seedOf(id){var h=0;String(id).split("").forEach(function(c){h=(h*31+c.charCodeAt(0))%97;});return h%7;}

/* ---------- views ---------- */
function header(){
  var nav=[["home","الرئيسية"],["works","أعمال الطلبة"],["news","أخبار النادي"]].map(function(n){return '<a href="#'+n[0]+'"'+(ui.view===n[0]?' aria-current="page"':"")+">"+n[1]+"</a>";}).join("");
  var adm=ui.admin?'<button class="info-btn admin-on" data-act="logout" title="خروج المسؤول" aria-label="خروج المسؤول">'+ic("lock",20)+"</button>":"";
  return '<header class="hdr"><div class="wrap"><a class="logo" href="#home"><span class="logo-mark">'+ic("flask",22)+'</span><span class="logo-text">'+esc(state.about.name||"دهشة علم")+"<small>"+esc(state.about.tagline)+'</small></span></a><nav class="nav" aria-label="القائمة الرئيسية">'+nav+'</nav><div class="hdr-actions">'+adm+'<button class="info-btn" data-act="about" aria-label="معلومات عن النادي" title="عن النادي">'+ic("info",22)+'</button><button class="btn btn-spark" data-act="upload">'+ic("upload",18)+'<span class="up-label">ارفع عملك</span></button></div></div></header>'+adminStrip();
}
function adminStrip(){
  if(!ui.admin)return "";
  var ex=state.works.concat(state.news).filter(function(x){return x.example;}).length;
  return '<div class="admin-strip"><div class="wrap"><span class="grow"><strong>وضع المسؤول</strong> — أضف وعدّل واحذف، وتُنشر التغييرات للجميع فوراً.</span>'+(ex?'<button class="btn btn-sm btn-ondeep" data-act="clear-examples">'+ic("trash",16)+"حذف الأمثلة</button>":"")+'<button class="btn btn-sm btn-ondeep" data-act="edit-about">'+ic("edit",16)+'تعديل «عن النادي»</button><button class="btn btn-sm btn-spark" data-act="new-work">'+ic("plus",16)+'عمل جديد</button><button class="btn btn-sm btn-spark" data-act="new-news">'+ic("plus",16)+'خبر جديد</button><button class="btn btn-sm btn-ondeep" data-act="logout">'+ic("lock",16)+"خروج</button></div></div>";
}
function exBadge(x){return x.example?'<span class="badge b-example">مثال</span>':"";}
function adminBtns(type,id){if(!(ui.admin))return "";return '<div class="card-admin"><button class="btn btn-sm btn-quiet btn-icon" data-act="edit-'+type+'" data-id="'+esc(id)+'" aria-label="تعديل">'+ic("edit",16)+'</button><button class="btn btn-sm btn-danger btn-icon" data-act="del-'+type+'" data-id="'+esc(id)+'" aria-label="حذف">'+ic("trash",16)+"</button></div>";}
function workCard(w){
  var f=FIELDS[w.field]||FIELDS.other,img=safeImg(w.images&&w.images[0])||(isCldVideo(w.video)?poster(w.video):"");
  var tag=(w.images&&w.images.length>1)?'<span class="badge b-ink media-tag">'+ic("image",14)+arNum(w.images.length)+" صور</span>":(safeUrl(w.video)?'<span class="badge b-ink media-tag">'+ic("video",14)+"فيديو</span>":"");
  return '<article class="card"><button class="card-hit" data-act="open-work" data-id="'+esc(w.id)+'" aria-label="'+esc(w.title)+'"></button>'+adminBtns("work",w.id)+'<div class="media">'+(img?'<img src="'+img+'" alt="" loading="lazy">':art(f.t,seedOf(w.id)))+tag+'</div><div class="card-body"><div class="card-top"><span class="badge b-'+f.t+'">'+esc(f.l)+"</span>"+exBadge(w)+'</div><h3 class="card-title">'+esc(w.title)+"</h3>"+(w.summary?'<p class="card-text">'+esc(w.summary)+"</p>":"")+'<div class="card-meta">'+ic("user",16)+"<span>"+esc(w.student)+"</span>"+(w.grade?'<span class="dot">الصف '+esc(w.grade)+"</span>":"")+"</div></div></article>";
}
function newsCard(n){
  var k=KIND[n.kind]||KIND.image,img=safeImg(n.images&&n.images[0])||(n.kind==="video"&&isCldVideo(n.url)?poster(n.url):""),media="";
  if(n.kind==="image")media='<div class="media">'+(img?'<img src="'+img+'" alt="" loading="lazy">':art("teal",seedOf(n.id)))+(n.images&&n.images.length>1?'<span class="badge b-ink media-tag">'+ic("image",14)+arNum(n.images.length)+" صور</span>":"")+"</div>";
  else if(n.kind==="video")media='<div class="media">'+(img?'<img src="'+img+'" alt="" loading="lazy">':art("deep",seedOf(n.id)))+'<span class="play" aria-hidden="true">'+ic("play",26)+"</span></div>";
  var u=safeUrl(n.url);
  return '<article class="card'+(n.kind==="link"?" news-link":"")+'"><button class="card-hit" data-act="open-news" data-id="'+esc(n.id)+'" aria-label="'+esc(n.title)+'"></button>'+adminBtns("news",n.id)+media+'<div class="card-body"><div class="card-top"><span class="badge b-'+k.t+'">'+ic(k.i,14)+k.l+"</span>"+exBadge(n)+'<span class="date">'+ic("calendar",14)+fmtDate(n.date)+'</span></div><h3 class="card-title">'+esc(n.title)+"</h3>"+(n.excerpt?'<p class="card-text">'+esc(n.excerpt)+"</p>":"")+(n.kind==="link"?'<div class="linkrow"><span class="linkrow-ic">'+ic("link",18)+'</span><span class="linkrow-host">'+esc(host(u)||"رابط خارجي")+"</span>"+ic("arrow",18)+"</div>":"")+"</div></article>";
}
function emptyBox(title,text,act,label){return '<div class="empty">'+ic("flask",32)+"<strong>"+title+"</strong><span>"+text+"</span>"+(act?'<button class="btn btn-primary" data-act="'+act+'">'+ic("plus",18)+label+"</button>":"")+"</div>";}
function loadingBox(){return '<div class="loading"><span class="spin"></span>جارٍ التحميل…</div>';}
function worksList(limit){
  if(ui.loading)return loadingBox();
  var list=state.works.slice().sort(byDate);
  if(!limit){if(ui.field!=="all")list=list.filter(function(w){return w.field===ui.field;});
    var q=ui.q.trim();if(q)list=list.filter(function(w){return (w.title+" "+w.student+" "+w.summary+" "+w.description).indexOf(q)>-1;});}
  else list=list.slice(0,limit);
  if(!list.length)return state.works.length?emptyBox("لا توجد نتائج","جرّب مجالاً آخر أو كلمة بحث مختلفة."):emptyBox("لم تُرفع أعمال بعد","ستظهر هنا تجارب الطلبة وابتكاراتهم.",ui.admin?"new-work":"",ui.admin?"أضف أول عمل":"");
  return '<div class="grid">'+list.map(workCard).join("")+"</div>";
}
function newsList(limit){
  if(ui.loading)return loadingBox();
  var list=state.news.slice().sort(byDate);
  if(!limit){if(ui.kind!=="all")list=list.filter(function(n){return n.kind===ui.kind;});}else list=list.slice(0,limit);
  if(!list.length)return state.news.length?emptyBox("لا توجد أخبار من هذا النوع","اختر نوعاً آخر."):emptyBox("لا توجد أخبار بعد","ستظهر هنا أخبار النادي بالصور والفيديو والروابط.",ui.admin?"new-news":"",ui.admin?"أضف أول خبر":"");
  return '<div class="grid">'+list.map(newsCard).join("")+"</div>";
}
function seg(group,cur,opts){return '<div class="seg" role="group" aria-label="تصفية">'+opts.map(function(o){return '<button type="button" data-seg="'+group+'" data-val="'+o[0]+'" aria-pressed="'+(cur===o[0])+'">'+(o[2]?ic(o[2],16):"")+o[1]+"</button>";}).join("")+"</div>";}
function home(){
  var a=state.about;
  var stats=(a.stats||[]).filter(function(s){return s.n;}).map(function(s){return "<span><strong>"+esc(s.n)+"</strong>"+esc(s.l)+"</span>";}).join("");
  return '<div class="wrap"><section class="hero"><div class="hero-text"><span class="eyebrow">'+ic("spark",16)+esc(a.tagline)+(a.school?" · "+esc(a.school):"")+"</span><h1>حيث تبدأ الدهشة… ويولد الابتكار</h1><p>هنا نعرض تجارب طلبتنا وابتكاراتهم، ونشارككم آخر أخبار النادي بالصور والفيديو والروابط.</p>"+(stats?'<div class="hero-stats">'+stats+"</div>":"")+'<div class="hero-cta"><a class="btn btn-spark" href="#works">'+ic("flask",18)+'تصفّح أعمال الطلبة</a><button class="btn btn-ondeep" data-act="about">'+ic("info",18)+'تعرّف على النادي</button></div></div><div class="hero-art">'+art("hero",0)+'</div></section></div>'+
  '<section class="section"><div class="wrap"><div class="sec-head"><h2>أحدث أعمال الطلبة</h2>'+(ui.admin?'<button class="btn btn-primary" data-act="new-work">'+ic("plus",18)+"عمل جديد</button>":'<a class="btn btn-quiet" href="#works">كل الأعمال'+ic("arrow",18)+"</a>")+"</div>"+worksList(3)+"</div></section>"+
  '<section class="section section-alt"><div class="wrap"><div class="sec-head"><h2>أخبار النادي</h2>'+(ui.admin?'<button class="btn btn-primary" data-act="new-news">'+ic("plus",18)+"خبر جديد</button>":'<a class="btn btn-quiet" href="#news">كل الأخبار'+ic("arrow",18)+"</a>")+"</div>"+newsList(3)+"</div></section>";
}
function worksPage(){
  var opts=[["all","الكل"]].concat(Object.keys(FIELDS).map(function(k){return [k,FIELDS[k].l];}));
  return '<section class="section"><div class="wrap"><div class="sec-head"><h2>أعمال الطلبة</h2>'+(ui.admin?'<button class="btn btn-primary" data-act="new-work">'+ic("plus",18)+"عمل جديد</button>":"")+'</div><p class="sec-sub">'+arNum(state.works.length)+' عملاً من تجارب الأعضاء وابتكاراتهم.</p><div class="tools"><label class="search">'+ic("search",18)+'<input id="q" type="search" placeholder="ابحث باسم المشروع أو الطالب" value="'+esc(ui.q)+'" aria-label="بحث"></label>'+seg("field",ui.field,opts)+'</div><div id="works-list">'+worksList()+"</div></div></section>";
}
function newsPage(){
  return '<section class="section"><div class="wrap"><div class="sec-head"><h2>أخبار النادي</h2>'+(ui.admin?'<button class="btn btn-primary" data-act="new-news">'+ic("plus",18)+"خبر جديد</button>":"")+'</div><div class="tools">'+seg("kind",ui.kind,[["all","الكل"],["image","صور","image"],["video","فيديو","video"],["link","روابط","link"]])+"</div>"+newsList()+"</div></section>";
}
function footer(){return '<footer class="ftr"><div class="wrap"><span>'+ic("flask",18)+esc(state.about.name)+" — "+esc(state.about.tagline)+'</span><span>'+(ui.admin?"":'<button data-act="login">'+ic("lock",16)+"دخول المسؤول</button>")+'<button data-act="about">'+ic("info",16)+"عن النادي</button></span></div></footer>";}

/* ---------- modals ---------- */
function modalShell(inner,wide,label){return '<div class="overlay" data-act="overlay"><div class="modal'+(wide?" modal-wide":"")+'" role="dialog" aria-modal="true" aria-label="'+esc(label)+'">'+inner+"</div></div>";}
function closeBtn(){return '<button class="btn btn-ghost btn-icon" data-act="close" aria-label="إغلاق">'+ic("close",20)+"</button>";}
function aboutModal(){

function sign(){return fetch(API+"/sign",{method:"POST",headers:{"x-admin-pin":ui.pin}}).then(function(r){
  if(r.status===401)throw {code:"pin"};
  if(!r.ok)return r.json().catch(function(){return {};}).then(function(j){throw {code:j.error||"sign"};});
  return r.json();});}
function uploadFile(file,onPct){return sign().then(function(s){return new Promise(function(res,rej){
  var fd=new FormData();fd.append("file",file);fd.append("api_key",s.apiKey);fd.append("timestamp",s.timestamp);fd.append("signature",s.signature);fd.append("folder",s.folder);
  var x=new XMLHttpRequest();x.open("POST","https://api.cloudinary.com/v1_1/"+encodeURIComponent(s.cloudName)+"/auto/upload");
  x.upload.onprogress=function(e){if(e.lengthComputable)onPct(Math.round(e.loaded/e.total*100));};
  x.onload=function(){var j={};try{j=JSON.parse(x.responseText);}catch(err){}
    if(x.status>=200&&x.status<300&&j.secure_url)res(j);else rej({code:"cloud",message:(j.error&&j.error.message)||""});};
  x.onerror=function(){rej({code:"net"});};x.send(fd);});});}

  (function next(){
    if(k>=n){ui.up=null;render();return;}
    setPct(0,"رفع الصورة "+arNum(k+1)+" من "+arNum(n));
    uploadFile(list[k],function(p){setPct(p);}).then(function(r){d.images.push(r.secure_url);k++;next();})
      .catch(function(e){ui.up=null;render();setErr(upErr(e));if(e&&e.code==="pin")logout();});
  })();
}
function addVideo(file,fieldId){
  if(ui.up){setErr("انتظر حتى ينتهي الرفع الحالي.");return;}
  if(!/^video\//.test(file.type)){setErr("اختر ملف فيديو.");return;}
  if(file.size>100*1024*1024){setErr(upErr({code:"big"}));return;}
  readForm();var d=ui.draft;ui.up={t:"video",pct:0,label:"جارٍ رفع الفيديو"};render();
  uploadFile(file,function(p){setPct(p);}).then(function(r){ui.up=null;if(fieldId==="f-video")d.video=r.secure_url;else d.url=r.secure_url;render();})
    .catch(function(e){ui.up=null;render();setErr(upErr(e));if(e&&e.code==="pin")logout();});
}
function setErr(t){var e=document.getElementById("err");if(e)e.textContent=t;else toast(t);}

/* ---------- save ---------- */
function save(next,msg){
  if(ui.up){setErr("انتظر حتى ينتهي رفع الملفات.");return;}
  ui.busy=true;render();
  fetch(API+"/content",{method:"PUT",headers:{"content-type":"application/json","x-admin-pin":ui.pin},body:JSON.stringify(next)}).then(function(r){
    ui.busy=false;
    if(r.ok){state=next;ui.modal=null;ui.draft=null;render();toast(msg||"تم الحفظ");return;}
    if(r.status===401){logout();toast("انتهت جلسة المسؤول. سجّل الدخول من جديد.");return;}
    render();setErr("تعذّر الحفظ (رمز الخطأ "+r.status+"). حاول مرة أخرى.");
  }).catch(function(){ui.busy=false;render();setErr("تعذّر الاتصال بالخادم. تحقق من الإنترنت ثم حاول مجدداً.");});
}
function clone(o){return JSON.parse(JSON.stringify(o));}
function submit(){
  readForm();var d=ui.draft,t=ui.modal.type,next=clone(state);
  if(t==="about-form"){if(!String(d.name||"").trim())return setErr("اكتب اسم النادي.");next.about=d;return save(next,"حُفظت معلومات النادي");}
  if(!String(d.title||"").trim())return setErr("اكتب العنوان.");
  if(t==="work-form"){
    if(!String(d.student||"").trim())return setErr("اكتب اسم الطالب أو الفريق.");
    if(d.video&&!safeUrl(d.video))return setErr("رابط الفيديو غير صحيح. يجب أن يبدأ بـ https://");
    var w={id:d.id||uid(),title:d.title.trim(),student:d.student.trim(),grade:d.grade||"",field:d.field||"other",summary:(d.summary||"").trim(),description:(d.description||"").trim(),images:d.images,video:safeUrl(d.video),date:d.date||today()};
    if(d.id)next.works=next.works.map(function(x){return x.id===d.id?w:x;});else next.works.unshift(w);
    return save(next,d.id?"حُفظ العمل":"نُشر العمل");
  }
  if(t==="news-form"){
    var u=safeUrl(d.url);
    if((d.kind==="link"||d.kind==="video")&&!u)return setErr("أدخل رابطاً صحيحاً يبدأ بـ https://");
    if(d.kind==="image"&&!d.images.length)return setErr("أضف صورة واحدة على الأقل.");
    var n={id:d.id||uid(),kind:d.kind,title:d.title.trim(),excerpt:(d.excerpt||"").trim(),date:d.date||today(),images:d.kind==="link"?[]:d.images,url:d.kind==="image"?"":u};
    if(d.id)next.news=next.news.map(function(x){return x.id===d.id?n:x;});else next.news.unshift(n);
    return save(next,d.id?"حُفظ الخبر":"نُشر الخبر");
  }
}

/* ---------- events ---------- */
app.addEventListener("click",function(e){
  var s=e.target.closest("[data-seg]");
  if(s){var g=s.dataset.seg,v=s.dataset.val;
    if(g==="field"){ui.field=v;}else if(g==="kind"){ui.kind=v;}else if(g==="nkind"){readForm();ui.draft.kind=v;if(v==="link")ui.draft.images=[];else if(v==="video")ui.draft.images=ui.draft.images.slice(0,1);}
    render();return;}
  var el=e.target.closest("[data-act]");if(!el)return;
  var a=el.dataset.act,id=el.dataset.id;
  if(a==="overlay"){if(e.target===el&&!ui.up)closeModal();return;}
  switch(a){
    case "close":closeModal();break;
    case "about":openModal({type:"about"});break;
    case "upload":if(ui.admin){ui.draft=blankWork();openModal({type:"work-form"});}else openModal({type:"submit-info"});break;
    case "login":openModal({type:"login"});break;
    case "logout":logout();toast("تم الخروج من وضع المسؤول");break;
    case "rm-video":readForm();if(el.dataset.field==="f-video")ui.draft.video="";else ui.draft.url="";render();break;
    case "open-work":openModal({type:"work",id:id,i:0});break;
    case "open-news":openModal({type:"news",id:id,i:0});break;
    case "thumb":ui.modal.i=+el.dataset.i;render();break;
    case "new-work":ui.draft=blankWork();openModal({type:"work-form"});break;
    case "new-news":ui.draft={kind:"image",title:"",excerpt:"",url:"",images:[],date:today()};openModal({type:"news-form"});break;
    case "edit-work":var w=find("works",id);if(w){ui.draft=clone(w);ui.draft.images=ui.draft.images||[];openModal({type:"work-form"});}break;
    case "edit-news":var n=find("news",id);if(n){ui.draft=clone(n);ui.draft.images=ui.draft.images||[];openModal({type:"news-form"});}break;
    case "edit-about":ui.draft=clone(state.about);openModal({type:"about-form"});break;
    case "del-work":case "del-news":var it=find(a==="del-work"?"works":"news",id);if(it)openModal({type:"confirm",title:"حذف «"+it.title+"»؟",text:"سيختفي من الموقع لكل الزوار.",col:a==="del-work"?"works":"news",id:id});break;
    case "clear-examples":openModal({type:"confirm",title:"حذف كل الأمثلة؟",text:"ستُحذف الأعمال والأخبار التجريبية، ويبقى ما أضفته أنت.",col:"examples"});break;
    case "confirm-yes":var m=ui.modal,next=clone(state);
      if(m.col==="examples"){next.works=next.works.filter(function(x){return !x.example;});next.news=next.news.filter(function(x){return !x.example;});save(next,"حُذفت الأمثلة");}
      else{next[m.col]=next[m.col].filter(function(x){return x.id!==m.id;});save(next,"تم الحذف");}break;
    case "rm-img":readForm();ui.draft.images.splice(+el.dataset.i,1);render();break;
  }
});
function blankWork(){return {title:"",student:"",grade:"",field:"phy",summary:"",description:"",images:[],video:"",date:today()};}
function persistAdmin(){try{if(ui.admin&&ui.pin)sessionStorage.setItem("dh-pin",ui.pin);else sessionStorage.removeItem("dh-pin");}catch(e){}}
function logout(){ui.admin=false;ui.pin="";persistAdmin();ui.modal=null;ui.draft=null;render();}
app.addEventListener("submit",function(e){e.preventDefault();if(e.target.id==="login-form")tryLogin();else submit();});
app.addEventListener("change",function(e){if(e.target.id==="f-images"&&e.target.files.length)addFiles(e.target.files);if(e.target.id==="f-vfile"&&e.target.files.length)addVideo(e.target.files[0],e.target.dataset.field);});
app.addEventListener("change",function(e){if(e.target.id==="f-video"||(e.target.id==="f-url"&&ui.draft&&ui.draft.kind==="video")){readForm();render();}});
app.addEventListener("input",function(e){if(e.target.id==="q"){ui.q=e.target.value;var l=document.getElementById("works-list");if(l)l.innerHTML=worksList();}});
app.addEventListener("dragover",function(e){var d=e.target.closest(".drop");if(d){e.preventDefault();d.classList.add("over");}});
app.addEventListener("dragleave",function(e){var d=e.target.closest(".drop");if(d)d.classList.remove("over");});
app.addEventListener("drop",function(e){var d=e.target.closest(".drop");if(d){e.preventDefault();var inp=d.querySelector("input[type=file]");if(inp&&inp.id==="f-vfile"){if(e.dataTransfer.files[0])addVideo(e.dataTransfer.files[0],inp.dataset.field);}else addFiles(e.dataTransfer.files);}});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&ui.modal&&!ui.busy&&!ui.up)closeModal();});
window.addEventListener("beforeunload",function(e){if(ui.up||ui.busy){e.preventDefault();e.returnValue="";}});

/* ---------- boot ---------- */
route();
try{var fl=sessionStorage.getItem("dh-flash");if(fl){sessionStorage.removeItem("dh-flash");toast(fl);}}catch(e){}
fetch(API+"/content",{cache:"no-store"}).then(function(r){return r.ok?r.json():Promise.reject(r.status);}).then(function(d){
  if(d&&d.about&&Array.isArray(d.works)&&Array.isArray(d.news))state=d;ui.loading=false;render();
}).catch(function(){ui.loading=false;render();toast("تعذّر تحميل المحتوى. أعد تحميل الصفحة.");});
})();
</script>
</body>
</html>
