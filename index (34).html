<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دهشة علم — نادي التجارب والابتكارات الطلابية</title>
<meta name="description" content="نادي دهشة علم للتجارب والابتكارات الطلابية: أعمال الطلبة وأخبار النادي.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&amp;family=Tajawal:wght@400;500;700;800&amp;display=swap">
<style id="dh-css">
/* Layout: sticky header, deep hero panel, card grids for works and news, modal dialogs for details, forms and "about". */
:root{
  --surface-100:#f7f4ec;--surface-200:#efeadd;--surface-raised:#ffffff;
  --ink:#1b2430;--ink-muted:#5a6472;--line:#ddd6c6;--line-strong:#8c8577;
  --teal:#0f6e6a;--on-teal:#ffffff;--teal-soft:#d9ecea;
  --spark:#f2b134;--on-spark:#1b2430;--spark-soft:#fbecc8;--spark-ink:#7a4f00;
  --coral:#c8432c;--on-coral:#ffffff;--coral-soft:#f8ddd6;--coral-ink:#a3301c;
  --deep:#13343b;--on-deep:#f7f4ec;--focus:#0f6e6a;--scrim:rgba(12,22,26,.55);
  --shadow-card:0 1px 2px rgba(27,36,48,.06),0 6px 18px rgba(27,36,48,.06);
  --shadow-pop:0 24px 60px rgba(19,52,59,.22);
  --font-display:"El Messiri","Tajawal",system-ui,sans-serif;
  --font-sans:"Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--space-8:32px;--space-12:48px;
  --radius-sm:8px;--radius-md:14px;--radius-lg:24px;--radius-pill:999px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --surface-100:#12171d;--surface-200:#1c232b;--surface-raised:#1a2129;
  --ink:#eef1ee;--ink-muted:#a3adb8;--line:#2e3843;--line-strong:#6b7684;
  --teal:#4fc2b9;--on-teal:#0b1a1a;--teal-soft:#183b3a;
  --spark:#f5c25a;--on-spark:#1b2430;--spark-soft:#3a3016;--spark-ink:#f5c25a;
  --coral:#f07a62;--on-coral:#1b0f0c;--coral-soft:#3d211b;--coral-ink:#f07a62;
  --deep:#1f4a52;--on-deep:#eef1ee;--focus:#f5c25a;--scrim:rgba(0,0,0,.65);
  --shadow-card:0 1px 2px rgba(0,0,0,.4);--shadow-pop:0 24px 60px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --surface-100:#12171d;--surface-200:#1c232b;--surface-raised:#1a2129;
  --ink:#eef1ee;--ink-muted:#a3adb8;--line:#2e3843;--line-strong:#6b7684;
  --teal:#4fc2b9;--on-teal:#0b1a1a;--teal-soft:#183b3a;
  --spark:#f5c25a;--on-spark:#1b2430;--spark-soft:#3a3016;--spark-ink:#f5c25a;
  --coral:#f07a62;--on-coral:#1b0f0c;--coral-soft:#3d211b;--coral-ink:#f07a62;
  --deep:#1f4a52;--on-deep:#eef1ee;--focus:#f5c25a;--scrim:rgba(0,0,0,.65);
  --shadow-card:0 1px 2px rgba(0,0,0,.4);--shadow-pop:0 24px 60px rgba(0,0,0,.6);
  color-scheme:dark}
html,body{background:var(--surface-100);margin:0}
img,video{max-width:100%}
[hidden]{display:none!important}
body{color:var(--ink);font-family:var(--font-sans);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
*,*::before,*::after{box-sizing:border-box}
#app{min-height:100vh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:1200px;margin-inline:auto;padding-inline:var(--space-8)}
h1,h2,h3{text-wrap:balance}
a{color:inherit}
button{font:inherit;color:inherit}
.ic{flex:none;display:block}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* buttons */
.btn{font-size:14px;font-weight:700;line-height:20px;display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);min-height:42px;padding:0 18px;border-radius:var(--radius-md);border:1px solid transparent;cursor:pointer;white-space:nowrap;text-decoration:none;transition:box-shadow .15s,transform .15s,background .15s}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--teal);color:var(--on-teal)}
.btn-primary:hover{box-shadow:inset 0 0 0 100px rgba(0,0,0,.1)}
.btn-spark{background:var(--spark);color:var(--on-spark)}
.btn-spark:hover{box-shadow:inset 0 0 0 100px rgba(0,0,0,.07)}
.btn-quiet{background:var(--surface-raised);color:var(--ink);border-color:var(--line-strong)}
.btn-quiet:hover{background:var(--surface-200)}
.btn-ghost{background:transparent;color:var(--ink)}
.btn-ghost:hover{background:var(--surface-200)}
.btn-danger{background:transparent;color:var(--coral-ink);border-color:var(--coral)}
.btn-danger:hover{background:var(--coral-soft)}
.btn-ondeep{background:transparent;color:var(--on-deep);border-color:var(--on-deep)}
.btn-ondeep:hover{background:rgba(255,255,255,.08)}
.btn-icon{width:42px;padding:0}
.btn-sm{min-height:34px;padding:0 12px;font-size:13px}
.btn-sm.btn-icon{width:34px;padding:0}

/* badges & segmented */
.badge{display:inline-flex;align-items:center;gap:var(--space-1);font-size:12.5px;line-height:18px;font-weight:700;padding:3px 10px;border-radius:var(--radius-pill);background:var(--surface-200);color:var(--ink);width:max-content;max-width:100%}
.b-teal{background:var(--teal-soft);color:var(--teal)}
.b-spark{background:var(--spark-soft);color:var(--spark-ink)}
.b-coral{background:var(--coral-soft);color:var(--coral-ink)}
.b-ink{background:var(--deep);color:var(--on-deep)}
.b-example{background:transparent;color:var(--ink-muted);border:1px dashed var(--line-strong);padding:2px 9px}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--surface-200);border-radius:var(--radius-lg);border:1px solid var(--line);max-width:100%}
.seg button{font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 14px;border:0;border-radius:var(--radius-pill);background:transparent;color:var(--ink-muted);cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface-raised);color:var(--teal);box-shadow:var(--shadow-card)}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface-raised);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:var(--space-6);padding-block:var(--space-3)}
.logo{display:flex;align-items:center;gap:var(--space-3);text-decoration:none;color:var(--ink);flex:none}
.logo-mark{width:44px;height:44px;border-radius:var(--radius-md);background:var(--deep);color:var(--spark);display:grid;place-items:center;position:relative}
.logo-mark::after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:var(--spark);top:-3px;left:-3px;box-shadow:0 0 0 3px var(--surface-raised)}
.logo-text{font-family:var(--font-display);font-size:24px;line-height:28px;font-weight:700;display:flex;flex-direction:column}
.logo-text small{font-family:var(--font-sans);font-size:12px;line-height:16px;font-weight:500;color:var(--ink-muted)}
.nav{display:flex;gap:var(--space-1);flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav a{font-size:15px;font-weight:700;text-decoration:none;color:var(--ink-muted);padding:10px 14px;border-radius:var(--radius-sm);position:relative;white-space:nowrap}
.nav a:hover{color:var(--ink);background:var(--surface-200)}
.nav a[aria-current="page"]{color:var(--teal)}
.nav a[aria-current="page"]::after{content:"";position:absolute;inset-inline:14px;bottom:3px;height:3px;border-radius:3px;background:var(--spark)}
.hdr-actions{display:flex;align-items:center;gap:var(--space-2)}
.info-btn{width:44px;height:44px;border-radius:var(--radius-pill);border:1px solid var(--line-strong);background:var(--surface-raised);color:var(--teal);display:grid;place-items:center;cursor:pointer}
.info-btn:hover{background:var(--teal-soft)}
.mini-btn{width:40px;height:40px;border-radius:var(--radius-pill);border:1px solid var(--line);background:transparent;color:var(--ink-muted);display:grid;place-items:center;cursor:pointer;transition:color .15s,background .15s}
.mini-btn:hover{background:var(--surface-200);color:var(--ink)}
.mini-btn[aria-pressed="true"]{color:var(--teal)}
@media (max-width:560px){.mini-btn{width:36px;height:36px}.info-btn{width:40px;height:40px}.hdr-actions{gap:6px}}
.logobar{background:#ffffff;border-bottom:1px solid #e6e1d4}
.logobar .wrap{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);padding-block:var(--space-2)}
.logobar img{display:block;height:76px;width:auto;max-width:32%;object-fit:contain}
.logobar .lg-vision{height:76px}
@media (max-width:560px){.logobar img{height:50px}.logobar .lg-vision{height:50px}}
.nav-ic{display:inline-flex!important;align-items:center;gap:6px}
.home-note{display:flex;align-items:flex-start;gap:var(--space-2);margin-bottom:var(--space-6);background:var(--spark-soft)}
.home-note .ic{color:var(--spark-ink);margin-top:3px}
.modal .home-note{margin-bottom:0}
.home-check{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;padding:12px 14px;border-radius:var(--radius-sm);background:var(--spark-soft);cursor:pointer}
.home-check input{width:20px;height:20px;accent-color:var(--teal)}
.home-check .ic{color:var(--spark-ink)}
.sec-head h2 .ic{color:var(--spark)}
.ai-btn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:var(--radius-pill);border:1px solid var(--teal);background:var(--teal-soft);color:var(--teal);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.ai-btn:hover{background:var(--teal);color:var(--on-teal)}
@media (max-width:860px){.ai-btn span{display:none}.ai-btn{width:40px;padding:0;justify-content:center}}
.ai-mark{background:var(--teal);color:var(--on-teal)}
.ai-simple{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.ai-simple input{width:18px;height:18px;accent-color:var(--teal)}
.ai-ideas{display:flex;flex-wrap:wrap;gap:6px}
.ai-idea{font-size:13px;padding:6px 12px;border-radius:var(--radius-pill);border:1px dashed var(--line-strong);background:transparent;color:var(--ink-muted);cursor:pointer}
.ai-idea:hover{border-color:var(--teal);color:var(--teal)}
.ai-tools{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-2);margin:var(--space-2) 0 var(--space-4)}
.ai-tool[aria-disabled="true"]{opacity:.5;cursor:default}
.ai-answer{border:1px solid var(--teal);background:var(--teal-soft);border-radius:var(--radius-md);padding:var(--space-4);margin-bottom:var(--space-4);font-size:15.5px;line-height:1.85;color:var(--ink)}
.ai-answer p{margin:0 0 8px}.ai-answer ul{margin:0 0 8px;padding-inline-start:1.3em}
.ai-answer-head{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--teal);margin-bottom:6px}
.ai-cursor{display:inline-block;width:8px;height:18px;margin-inline-start:4px;background:var(--teal);vertical-align:middle;animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:0}}
.ai-wait{display:flex;align-items:center;gap:var(--space-3);color:var(--ink-muted)}
.ai-err{border-color:var(--coral);background:var(--coral-soft);color:var(--ink)}
.ai-site{display:flex;flex-direction:column;gap:6px;margin-bottom:var(--space-3)}
.ai-site h3{margin:0 0 4px}
.ai-hit{display:flex;align-items:center;gap:var(--space-2);text-align:start;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--surface-100);color:var(--ink);font-size:14.5px;cursor:pointer}
.ai-hit:hover{border-color:var(--teal)}
.admin-on{background:var(--deep);color:var(--on-deep);border-color:var(--deep)}

/* admin strip */
.admin-strip{background:var(--deep);color:var(--on-deep);font-size:14px}
.admin-strip .wrap{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;padding-block:var(--space-2)}
.admin-strip strong{color:var(--spark)}
.admin-strip .grow{flex:1;min-width:200px}
.meter{display:inline-flex;align-items:center;gap:var(--space-2);font-size:13px;opacity:.9}
.meter i{display:block;width:90px;height:6px;border-radius:6px;background:rgba(255,255,255,.2);overflow:hidden}
.meter i b{display:block;height:100%;background:var(--spark)}

/* hero */
.hero{min-height:380px;margin-top:var(--space-6);border-radius:var(--radius-lg);background:var(--deep);color:var(--on-deep);display:grid;grid-template-columns:1.3fr 1fr;overflow:hidden}
.hero-text{padding:var(--space-12);display:flex;flex-direction:column;justify-content:center;gap:var(--space-4);min-width:0}
.eyebrow{display:inline-flex;align-items:center;gap:var(--space-2);color:var(--spark);font-size:14px;font-weight:700}
.hero h1{margin:0;font-family:var(--font-display);font-size:clamp(34px,5vw,52px);line-height:1.22;font-weight:700}
.hero p{margin:0;font-size:17px;line-height:1.7;opacity:.92;max-width:46ch}
.hero-cta{display:flex;gap:var(--space-3);flex-wrap:wrap;padding-top:var(--space-2)}
.hero-art{position:relative;min-height:220px}
.hero-art svg{position:absolute;inset:0;width:100%;height:100%}
.deco{pointer-events:none;user-select:none;display:block}
.kid{position:absolute;bottom:0;height:92%;width:auto;filter:drop-shadow(0 10px 18px rgba(0,0,0,.28))}
.kid-girl{right:6%}
.kid-boy{left:6%}
.deco-h{height:72px;width:auto;margin-inline-start:var(--space-2);transform:rotate(-6deg)}
.deco-empty{height:150px;width:auto}
.deco-peek{position:absolute;top:-78px;left:84px;height:120px;width:auto}
.modal:has(.deco-peek){margin-top:64px}
.deco-mark{width:64px;height:64px;object-fit:contain;flex:none}
@media (prefers-reduced-motion:no-preference){.kid{animation:bob 6s ease-in-out infinite alternate}.kid-boy{animation-delay:-3s}@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-8px)}}}
.hero-stats{display:flex;gap:var(--space-6);flex-wrap:wrap;padding-top:var(--space-2);font-size:13px;opacity:.9}
.hero-stats strong{display:block;font-family:var(--font-display);font-size:26px;line-height:1.2;color:var(--spark);font-variant-numeric:tabular-nums}

/* sections */
main{flex:1}
.section{padding-block:var(--space-12)}
.section-alt{background:var(--surface-200)}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap;margin-bottom:var(--space-6)}
.sec-head h2{margin:0;font-family:var(--font-display);font-size:clamp(26px,3.4vw,34px);line-height:1.3;font-weight:700;display:flex;align-items:center;gap:var(--space-3)}
.sec-head h2::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--spark);flex:none}
.sec-sub{margin:-12px 0 var(--space-6);color:var(--ink-muted);font-size:15px}
.tools{display:flex;gap:var(--space-3);flex-wrap:wrap;align-items:center;margin-bottom:var(--space-6)}
.search{display:flex;align-items:center;gap:var(--space-2);background:var(--surface-raised);border:1px solid var(--line-strong);border-radius:var(--radius-pill);padding:0 14px;min-height:44px;flex:1;min-width:200px;max-width:340px;color:var(--ink-muted)}
.search input{border:0;background:transparent;font:inherit;font-size:15px;color:var(--ink);flex:1;min-width:0;outline:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:var(--space-6)}
.more{display:flex;justify-content:center;margin-top:var(--space-6)}

/* cards */
.card{background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s;position:relative;min-width:0}
.card:hover{box-shadow:var(--shadow-card);transform:translateY(-2px)}
.card-hit{position:absolute;inset:0;z-index:1;border:0;background:transparent;cursor:pointer;border-radius:inherit}
.media{position:relative;aspect-ratio:16/10;background:var(--surface-200);overflow:hidden;max-width:100%}
.media img,.media svg{width:100%;height:100%;object-fit:cover;display:block}
.media-tag{position:absolute;top:var(--space-3);inset-inline-start:var(--space-3)}
.card-body{padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-2);flex:1}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);flex-wrap:wrap}
.card-title{margin:0;font-size:19px;line-height:1.5;font-weight:700}
.card-text{margin:0;font-size:14px;line-height:1.65;color:var(--ink-muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{margin-top:auto;padding-top:var(--space-3);border-top:1px solid var(--line);display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--ink-muted);flex-wrap:wrap}
.dot::before{content:"•";margin-inline:4px}
.date{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:500;color:var(--ink-muted)}
.play{position:absolute;inset:0;margin:auto;width:64px;height:64px;border-radius:50%;background:var(--coral);color:var(--on-coral);display:grid;place-items:center;box-shadow:0 0 0 8px rgba(255,255,255,.18)}
.news-link{border-top:6px solid var(--spark)}
.linkrow{margin-top:auto;display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3);border-radius:var(--radius-sm);background:var(--surface-200);border:1px solid var(--line);font-size:14px;font-weight:700;min-width:0}
.linkrow-ic{width:36px;height:36px;border-radius:var(--radius-sm);background:var(--spark);color:var(--on-spark);display:grid;place-items:center;flex:none}
.linkrow-host{flex:1;direction:ltr;text-align:right;color:var(--ink-muted);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.card-admin{position:absolute;top:var(--space-3);inset-inline-end:var(--space-3);z-index:2;display:flex;gap:6px}
.card-admin .btn{background:var(--surface-raised);box-shadow:var(--shadow-card)}

/* art */
.art-ground{fill:var(--teal-soft)}.art-b1{fill:var(--teal);opacity:.9}.art-b2{fill:var(--spark)}
.art-coral .art-ground{fill:var(--coral-soft)}.art-coral .art-b1{fill:var(--coral)}
.art-spark .art-ground{fill:var(--spark-soft)}.art-spark .art-b1{fill:var(--spark)}.art-spark .art-b2{fill:var(--teal)}
.art-deep .art-ground{fill:var(--deep)}.art-deep .art-b1{fill:var(--teal);opacity:.55}.art-deep .art-b2{fill:var(--coral);opacity:.7}
.art-hero .art-ground{fill:transparent}.art-hero .art-b1{fill:var(--teal)}
@media (prefers-reduced-motion:no-preference){
  .art-hero circle{animation:rise 9s ease-in-out infinite alternate}
  .art-hero circle:nth-child(3n){animation-duration:12s}
  .art-hero circle:nth-child(2n){animation-delay:-4s}
  @keyframes rise{from{transform:translateY(4px)}to{transform:translateY(-6px)}}
}

/* empty */
.empty{border:2px dashed var(--line-strong);border-radius:var(--radius-md);padding:var(--space-8);text-align:center;color:var(--ink-muted);display:flex;flex-direction:column;align-items:center;gap:var(--space-3)}
.empty strong{color:var(--ink);font-size:17px}

/* footer */
.ftr{background:var(--deep);color:var(--on-deep);font-size:14px}
.ftr .wrap{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap;padding-block:var(--space-6)}
.ftr span{display:inline-flex;align-items:center;gap:var(--space-2)}
.ftr button{font-weight:700;display:inline-flex;align-items:center;gap:6px;background:transparent;border:0;color:var(--spark);cursor:pointer;padding:6px}

/* modal */
.overlay{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;padding:calc(var(--space-8) + env(safe-area-inset-top,0px)) var(--space-4) var(--space-8);z-index:50;overflow-y:auto}
.modal{background:var(--surface-raised);color:var(--ink);border-radius:var(--radius-lg);box-shadow:var(--shadow-pop);width:100%;max-width:620px;padding:var(--space-8);display:flex;flex-direction:column;gap:var(--space-4);position:relative}
.modal-wide{max-width:820px}
.modal-head{display:flex;align-items:center;gap:var(--space-4)}
.modal-head>div{flex:1;min-width:0}
.modal-head h2{margin:0;font-family:var(--font-display);font-size:24px;line-height:1.35;font-weight:700}
.modal-head p{margin:0;font-size:14px;color:var(--ink-muted)}
.mark{width:56px;height:56px;border-radius:var(--radius-md);background:var(--deep);color:var(--spark);display:grid;place-items:center;flex:none}

function tone(f1,f2,dur,type,vol,delay){
  var c=sfx.ctx,t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
  o.type=type||"sine";o.frequency.setValueAtTime(f1,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.08,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.02);
}
function play(name){
  if(!sfx.on)return;
  try{
    if(!sfx.ctx){var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;sfx.ctx=new AC();}
    if(sfx.ctx.state==="suspended")sfx.ctx.resume();
    switch(name){
      case "tap":tone(880,660,0.07,"sine",0.05);break;
      case "open":tone(520,880,0.16,"sine",0.06);tone(1320,null,0.12,"sine",0.025,0.06);break;
      case "close":tone(760,420,0.14,"sine",0.05);break;
      case "bubble":tone(300,900,0.12,"sine",0.06);tone(500,1400,0.1,"sine",0.04,0.08);break;
      case "success":tone(659,null,0.14,"triangle",0.07);tone(880,null,0.14,"triangle",0.07,0.1);tone(1319,null,0.26,"triangle",0.06,0.2);break;
      case "error":tone(220,180,0.18,"square",0.035);tone(196,160,0.22,"square",0.035,0.16);break;
      case "upload":tone(440,990,0.22,"sine",0.05);break;
    }
  }catch(e){}
}

function aiPrompt(q,simple){q=String(q||"").trim();return simple?"اشرح لطالب في المدرسة بالعربية وبأسلوب مبسّط مع مثال: "+q:q;}
function siteMatches(q){
  q=String(q||"").trim();if(q.length<2)return [];
  var words=q.split(/\s+/).filter(function(w){return w.length>1;});
  function score(t){t=String(t||"");var n=0;words.forEach(function(w){if(t.indexOf(w)>-1)n++;});return n;}
  var out=[];
  state.works.forEach(function(w){var sc=score(w.title+" "+w.summary+" "+w.description+" "+w.student+" "+(FIELDS[w.field]||{}).l);if(sc)out.push({sc:sc,act:"open-work",id:w.id,title:w.title,kind:"عمل طالب"});});
  state.news.forEach(function(n){var sc=score(n.title+" "+n.excerpt);if(sc)out.push({sc:sc,act:"open-news",id:n.id,title:n.title,kind:"خبر"});});
  return out.sort(function(a,b){return b.sc-a.sc;}).slice(0,5);
}
function mdLite(t){
  var lines=esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").split(/\n/),out="",list="";
  lines.forEach(function(l){var m=l.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)$/);
    if(m){if(!list){list="<ul>";}list+="<li>"+m[1]+"</li>";return;}
    if(list){out+=list+"</ul>";list="";}
    l=l.replace(/^#+\s*/,"");if(l.trim())out+="<p>"+l+"</p>";});
  if(list)out+=list+"</ul>";return out;}
function aiErrText(e,status){
  return e==="busy"?"المساعد مشغول الآن بسبب كثرة الأسئلة. حاول بعد دقيقة.":
    e==="not_configured"?"لم يُضف أي مفتاح ذكاء اصطناعي في إعدادات الموقع (Environment Variables)، أو لم يُعَد النشر بعد إضافته.":
    e==="bad_key"?"أحد المفاتيح غير صحيح أو غير مفعّل. راجعي المفاتيح في إعدادات الموقع.":
    e==="no_model"?"تعذّر الحصول على إجابة الآن. حاول بعد قليل.":e==="blocked"?"هذا السؤال لا يناسب مساعد النادي. جرّب سؤالاً علمياً آخر.":
    e==="timeout"?"تأخّر المساعد كثيراً. حاول مرة أخرى بسؤال أقصر.":e==="list_failed"?"تعذّر الاتصال بخدمة Gemini الآن. حاول بعد قليل.":
    status===404?"المساعد غير مفعّل على هذا الموقع (لم يُعثر على /api/ask).":
    "تعذّر الحصول على إجابة الآن (رمز "+(status||"؟")+"). حاول مرة أخرى.";}
function askHere(){
  var q=String(ui.aiq||"").trim();if(q.length<2){ui.aiAns={err:"اكتب سؤالك أولاً."};updateAi();return;}
  if(ui.aiAns&&ui.aiAns.loading)return;
  ui.aiAns={loading:true};updateAi();play("tap");
  var ctl=window.AbortController?new AbortController():null,timer=setTimeout(function(){if(ctl)ctl.abort();},45000);
  fetch("/api/ask",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({q:q,g:ui.aiG||""}),signal:ctl?ctl.signal:undefined}).then(function(r){
    var ct=r.headers.get("content-type")||"";
    if(!r.ok||ct.indexOf("application/json")>-1){
      return r.json().catch(function(){return {};}).then(function(j){
        if(!r.ok||!j.answer)throw {e:j.error,status:j.status||r.status,d:j.detail};
        // reveal the full answer letter by letter
        var full=j.answer,k=0;ui.aiAns={text:"",q:q,streaming:true};updateAi();
        return new Promise(function(done){(function step(){
          if(!ui.aiAns||ui.aiAns.q!==q){done();return;}
          k=Math.min(full.length,k+Math.max(3,Math.ceil(full.length/60)));ui.aiAns.text=full.slice(0,k);
          var body=document.getElementById("ai-body");if(body)body.innerHTML=mdLite(ui.aiAns.text)+'<span class="ai-cursor"></span>';
          if(k<full.length)setTimeout(step,25);else done();})();});
      });
    }
    ui.aiAns={text:"",q:q,streaming:true};updateAi();
    var body=document.getElementById("ai-body");
    function paint(){body=document.getElementById("ai-body")||body;if(body)body.innerHTML=mdLite(ui.aiAns.text)+(ui.aiAns.streaming?'<span class="ai-cursor"></span>':"");}
    if(!r.body||!r.body.getReader){return r.text().then(function(t){ui.aiAns.text=t;});}
    var rd=r.body.getReader(),dec=new TextDecoder();
    return (function pump(){return rd.read().then(function(x){
      if(x.done)return;
      ui.aiAns.text+=dec.decode(x.value,{stream:true});paint();return pump();});})();
  }).then(function(){
    clearTimeout(timer);
    if(!ui.aiAns||ui.aiAns.err)return;
    ui.aiAns.streaming=false;
    if(ui.aiAns.text.indexOf("[[blocked]]")>-1||!ui.aiAns.text.trim()){ui.aiAns={err:"هذا السؤال لا يناسب مساعد النادي. جرّب سؤالاً علمياً آخر."};play("error");}
    else play("success");
    updateAi();
  }).catch(function(x){clearTimeout(timer);
    var aborted=x&&x.name==="AbortError";
    if(aborted&&ui.aiAns&&ui.aiAns.text){ui.aiAns.streaming=false;updateAi();return;}
    ui.aiAns={err:aborted?aiErrText("timeout"):(x&&("e" in x||"status" in x))?aiErrText(x.e,x.status):"تعذّر الاتصال. تحقق من الإنترنت ثم حاول مجدداً.",detail:x&&x.d};
    play("error");updateAi();});
}

      (dn?'<div class="game-why '+(right?"ok":"no")+'">'+(right?"صحيح! 🌟":"ليس تماماً.")+(t.why?" "+inl(t.why):"")+'</div><div class="form-foot"><button type="button" class="btn btn-primary" data-act="g-next">التالي'+ic("arrow",18)+"</button></div>":"")+"</div>";

function gameAct(a,el){
  var L=ui.lab,d=L.data,p=L.play;
  if(a==="g-pick"){p.picked=+el.dataset.i;if(p.picked===d.quiz[p.i].answer){p.score++;play("success");}else play("error");}
  else if(a==="g-tf"){p.picked=el.dataset.v==="true";if(p.picked===d.tf[p.i].t){p.score++;play("success");}else play("error");}
  else if(a==="g-ord"){p.chosen.push(+el.dataset.i);play("tap");}
  else if(a==="g-undo"){p.chosen.pop();p.checked=false;play("tap");}
  else if(a==="g-check"){p.checked=true;p.orderRight=p.chosen.filter(function(si,k){return si===k;}).length;p.score+=p.orderRight;play(p.orderRight===d.order.steps.length?"success":"error");}
  else if(a==="g-again"){labReset();play("tap");}
  else if(a==="g-next"){play("tap");p.picked=null;
    if(p.stage==="quiz"){if(p.i<d.quiz.length-1)p.i++;else if(d.tf&&d.tf.length){p.stage="tf";p.i=0;}else if(d.order)p.stage="order";else p.stage="end";}
    else if(p.stage==="tf"){if(p.i<d.tf.length-1)p.i++;else if(d.order)p.stage="order";else p.stage="end";}
    else if(p.stage==="order"){p.stage="end";play("success");}}
  updateLab();
}

function sha(t){
  if(window.crypto&&crypto.subtle&&window.TextEncoder)return crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ("0"+x.toString(16)).slice(-2);}).join("");});
  return Promise.reject(new Error("no-crypto"));
}
var tries=0,lockUntil=0;
function tryLogin(){
  var el=document.getElementById("pin");if(!el)return;var pin=el.value.trim();
  if(!pin){setErr("أدخل رمز الدخول.");return;}
  if(Date.now()<lockUntil){setErr("محاولات كثيرة. انتظر قليلاً ثم حاول مجدداً.");return;}
  sha("dahsha-ilm:"+pin).then(function(h){
    if(h===PIN_HASH){tries=0;ui.pin=pin;ui.admin=true;persistAdmin();ui.modal=null;render();play("success");toast("أهلاً بك — وضع المسؤول مفعّل");}
    else{tries++;if(tries>=5){lockUntil=Date.now()+30000;tries=0;}el.value="";setErr("الرمز غير صحيح.");el.focus();}
  }).catch(function(){setErr("تعذّر التحقق من الرمز في هذا المتصفح.");});
}

  }return "";
}
function find(col,id){for(var i=0;i<state[col].length;i++)if(state[col][i].id===id)return state[col][i];return null;}

/* ---------- render ---------- */
var app=document.getElementById("app");
function render(){
  var body=ui.view==="works"?worksPage():ui.view==="news"?newsPage():ui.view==="athome"?homeLabPage():home();
  var scroll=null,ov=document.querySelector(".overlay");if(ov)scroll=ov.scrollTop;
  app.innerHTML=header()+"<main>"+body+"</main>"+footer()+modal()+(ui.busy?'<div class="busy" role="status"><div><span class="spin"></span>جارٍ الحفظ…</div></div>':"")+(ui.toast?'<div class="toast" role="status">'+esc(ui.toast)+"</div>":"");
  var ov2=document.querySelector(".overlay");if(ov2&&scroll!=null)ov2.scrollTop=scroll;
  document.body.style.overflow=ui.modal?"hidden":"";
}
function openModal(m){play("open");ui.modal=m;render();var f=document.querySelector(".modal input,.modal textarea,.modal [data-act=close]");if(f)f.focus();}
function closeModal(){if(ui.modal)play("close");ui.modal=null;ui.draft=null;render();}
function toast(t){ui.toast=t;render();clearTimeout(toast._t);toast._t=setTimeout(function(){ui.toast="";render();},3200);}

function route(){var h=(location.hash||"").replace("#","");
  if(h==="about"){ui.view="home";ui.modal={type:"about"};}
  else ui.view=(h==="works"||h==="news"||h==="athome")?h:"home";
  render();window.scrollTo(0,0);}
window.addEventListener("hashchange",function(){play("tap");route();});

/* ---------- draft sync ---------- */
function readForm(){
  var f=document.getElementById("form");if(!f||!ui.draft)return;
  var g=function(id){var el=document.getElementById(id);return el?el.value:undefined;},d=ui.draft;
  if(f.dataset.kind==="about"){d.name=g("a-name");d.school=g("a-school");d.tagline=g("a-tagline");d.description=g("a-desc");d.goals=g("a-goals").split("\n").map(function(s){return s.trim();}).filter(Boolean);
    d.stats=[0,1,2].map(function(i){return {n:g("a-sn"+i).trim(),l:g("a-sl"+i).trim()};});d.supervisor=g("a-sup");d.meeting=g("a-meet");d.contact=g("a-contact");return;}
  ["title","student","grade","field","date","summary","video","url","excerpt"].forEach(function(k){var v=g("f-"+k);if(v!==undefined)d[k]=v;});
  var desc=g("f-desc");if(desc!==undefined)d.description=desc;
  var hm=document.getElementById("f-home");if(hm)d.home=hm.checked;
  var mt=g("f-materials");if(mt!==undefined)d.materials=mt.split("\n").map(function(x){return x.trim();}).filter(Boolean);
}

/* ---------- images ---------- */
function upErr(e){var c=e&&e.code;
  if(c==="preset")return "لم يُنشأ إعداد الرفع «"+UPLOAD_PRESET+"» في Cloudinary بعد، أو ليس من نوع Unsigned. راجع الخطوة ١ في ملف التعليمات.";
  if(c==="cloud")return "رفض Cloudinary الملف"+(e.message?": "+e.message:".");
  if(c==="big")return "حجم الملف أكبر من ١٠٠ ميجابايت. قصّر الفيديو أو اضغطه ثم أعد المحاولة.";
  return "انقطع الاتصال أثناء الرفع. حاول مجدداً.";}
function cloudUpload(kind,file,extra,onPct){return new Promise(function(res,rej){
  var fd=new FormData();fd.append("file",file);fd.append("upload_preset",UPLOAD_PRESET);
  Object.keys(extra||{}).forEach(function(k){fd.append(k,extra[k]);});
  var x=new XMLHttpRequest();x.open("POST",CLD_API+"/"+kind+"/upload");
  if(onPct)x.upload.onprogress=function(e){if(e.lengthComputable)onPct(Math.round(e.loaded/e.total*100));};
  x.onload=function(){var j={};try{j=JSON.parse(x.responseText);}catch(err){}
    if(x.status>=200&&x.status<300&&j.secure_url)return res(j);
    var m=(j.error&&j.error.message)||"";
    rej({code:/preset/i.test(m)?"preset":"cloud",message:m});};
  x.onerror=function(){rej({code:"net"});};x.send(fd);});}
function uploadFile(file,onPct){return cloudUpload("auto",file,{},onPct);}
function setPct(p,label){if(!ui.up)return;ui.up.pct=p;if(label)ui.up.label=label;var f=document.getElementById("upfill"),t=document.getElementById("uptext");if(f)f.style.width=p+"%";if(t)t.textContent=(ui.up.label||"")+" "+arNum(p)+"٪";}
function addFiles(files){
  if(ui.up){setErr("انتظر حتى ينتهي الرفع الحالي.");return;}
  readForm();var d=ui.draft,max=ui.modal.type==="work-form"?6:(d.kind==="video"?1:8);
  var list=Array.prototype.filter.call(files,function(f){return /^image\//.test(f.type);});
  if(!list.length){setErr("اختر ملفات صور (JPG أو PNG).");return;}
  if(max===1)d.images=[];
  var room=max-d.images.length;if(room<=0){setErr("وصلت للحد الأقصى من الصور.");return;}
  list=list.slice(0,room);var n=list.length,k=0;
  ui.up={t:"images",pct:0,label:"رفع الصورة ١ من "+arNum(n)};render();
  (function next(){
    if(k>=n){ui.up=null;play("upload");render();return;}
    setPct(0,"رفع الصورة "+arNum(k+1)+" من "+arNum(n));
    uploadFile(list[k],function(p){setPct(p);}).then(function(r){d.images.push(r.secure_url);k++;next();})
      .catch(function(e){ui.up=null;render();setErr(upErr(e));});
  })();
}
function addVideo(file,fieldId){
  if(ui.up){setErr("انتظر حتى ينتهي الرفع الحالي.");return;}
  if(!/^video\//.test(file.type)){setErr("اختر ملف فيديو.");return;}
  if(file.size>100*1024*1024){setErr(upErr({code:"big"}));return;}
  readForm();var d=ui.draft;ui.up={t:"video",pct:0,label:"جارٍ رفع الفيديو"};render();
  uploadFile(file,function(p){setPct(p);}).then(function(r){ui.up=null;play("upload");if(fieldId==="f-video")d.video=r.secure_url;else d.url=r.secure_url;render();})
    .catch(function(e){ui.up=null;render();setErr(upErr(e));});
}
function setErr(t){if(!/^جارٍ/.test(t))play("error");var e=document.getElementById("err");if(e)e.textContent=t;else toast(t);}

/* ---------- save (content is a JSON file on Cloudinary) ---------- */
function rememberLocal(d){try{localStorage.setItem("dh-last",JSON.stringify(d));}catch(e){}}
function save(next,msg){
  if(ui.up){setErr("انتظر حتى ينتهي رفع الملفات.");return;}
  next.savedAt=Date.now();
  ui.busy=true;render();
  var blob=new Blob([JSON.stringify(next)],{type:"application/json"});
  cloudUpload("raw",new File([blob],"content.json",{type:"application/json"}),{tags:CONTENT_TAG}).then(function(){
    ui.busy=false;state=next;rememberLocal(next);ui.modal=null;ui.draft=null;render();play("success");toast((msg||"تم الحفظ")+" — يظهر للزوار خلال دقيقة");
  }).catch(function(e){ui.busy=false;render();setErr(e&&e.code==="net"?"تعذّر الاتصال بـ Cloudinary. تحقق من الإنترنت ثم حاول مجدداً.":upErr(e));});
}
function clone(o){return JSON.parse(JSON.stringify(o));}
function submit(){
  readForm();var d=ui.draft,t=ui.modal.type,next=clone(state);
  if(t==="about-form"){if(!String(d.name||"").trim())return setErr("اكتب اسم النادي.");next.about=d;return save(next,"حُفظت معلومات النادي");}
  if(!String(d.title||"").trim())return setErr("اكتب العنوان.");
  if(t==="work-form"){
    if(!String(d.student||"").trim())return setErr("اكتب اسم الطالب أو الفريق.");
    if(d.video&&!safeUrl(d.video))return setErr("رابط الفيديو غير صحيح. يجب أن يبدأ بـ https://");
    var w={id:d.id||uid(),title:d.title.trim(),student:d.student.trim(),grade:d.grade||"",field:d.field||"other",summary:(d.summary||"").trim(),description:(d.description||"").trim(),images:d.images,video:safeUrl(d.video),date:d.date||today(),home:!!d.home,materials:d.materials||[]};
    if(d.id)next.works=next.works.map(function(x){return x.id===d.id?w:x;});else next.works.unshift(w);
    return save(next,d.id?"حُفظ العمل":"نُشر العمل");
  }
  if(t==="news-form"){
    var u=safeUrl(d.url);
    if((d.kind==="link"||d.kind==="video")&&!u)return setErr("أدخل رابطاً صحيحاً يبدأ بـ https://");
    if(d.kind==="image"&&!d.images.length)return setErr("أضف صورة واحدة على الأقل.");
    var n={id:d.id||uid(),kind:d.kind,title:d.title.trim(),excerpt:(d.excerpt||"").trim(),date:d.date||today(),images:d.kind==="link"?[]:d.images,url:d.kind==="image"?"":u};
    if(d.id)next.news=next.news.map(function(x){return x.id===d.id?n:x;});else next.news.unshift(n);
    return save(next,d.id?"حُفظ الخبر":"نُشر الخبر");
  }
}

/* ---------- events ---------- */
app.addEventListener("click",function(e){
  var s=e.target.closest("[data-seg]");
  if(s){play("tap");var g=s.dataset.seg,v=s.dataset.val;
    if(g==="labmode"||g==="lablv"||g==="labsk"){var L0=labState(),lt=document.getElementById("lab-q");if(lt)L0.topic=lt.value;if(g==="labsk"){L0.sk=v;L0.data=null;L0.err="";}else if(g==="labmode"){L0.mode=v;L0.data=null;L0.err="";}else{L0.level=v;try{localStorage.setItem("dh-lv",v);}catch(e){}}}else if(g==="aig"){var lt2=document.getElementById("lab-q");if(lt2&&ui.lab)ui.lab.topic=lt2.value;ui.aiG=v;try{localStorage.setItem("dh-g",v);}catch(e){}var ta0=document.getElementById("ai-q");if(ta0)ui.aiq=ta0.value;}else if(g==="field"){ui.field=v;}else if(g==="kind"){ui.kind=v;}else if(g==="nkind"){readForm();ui.draft.kind=v;if(v==="link")ui.draft.images=[];else if(v==="video")ui.draft.images=ui.draft.images.slice(0,1);}
    render();return;}
  var el=e.target.closest("[data-act]");if(!el)return;
  var a=el.dataset.act,id=el.dataset.id;
  if(a==="overlay"){if(e.target===el&&!ui.up)closeModal();return;}
  switch(a){
    case "close":closeModal();break;
    case "theme":play("tap");toggleTheme();break;
    case "ai":openModal({type:"ai"});break;
    case "lab":labState();openModal({type:"lab"});break;
    case "lab-idea":labState().topic=el.dataset.q;var lq=document.getElementById("lab-q");if(lq)lq.value=el.dataset.q;labGo();break;
    case "lab-unfile":if(ui.lab)ui.lab.file=null;updateLabFile();play("tap");break;
    case "ws-pdf":sheetPrint();play("tap");break;
    case "ws-word":sheetWord();play("success");break;
    case "lab-new":ui.lab.data=null;ui.lab.topic="";render();var lq2=document.getElementById("lab-q");if(lq2)lq2.focus();break;
    case "g-pick":case "g-tf":case "g-ord":case "g-undo":case "g-check":case "g-again":case "g-next":gameAct(a,el);break;
    case "s-step":case "s-reset":case "s-opt":simAct(a,el);break;
    case "ai-idea":ui.aiq=el.dataset.q;var ta=document.getElementById("ai-q");if(ta)ta.value=ui.aiq;askHere();break;
    case "sound":toggleSound();break;
    case "about":openModal({type:"about"});break;
    case "upload":if(ui.admin){ui.draft=blankWork();openModal({type:"work-form"});}else openModal({type:"submit-info"});break;
    case "login":openModal({type:"login"});break;
    case "logout":logout();toast("تم الخروج من وضع المسؤول");break;
    case "rm-video":readForm();if(el.dataset.field==="f-video")ui.draft.video="";else ui.draft.url="";render();break;
    case "open-work":openModal({type:"work",id:id,i:0});break;
    case "open-news":openModal({type:"news",id:id,i:0});break;
    case "thumb":ui.modal.i=+el.dataset.i;render();break;
    case "new-home":ui.draft=blankWork();ui.draft.home=true;openModal({type:"work-form"});break;
    case "new-work":ui.draft=blankWork();openModal({type:"work-form"});break;
    case "new-news":ui.draft={kind:"image",title:"",excerpt:"",url:"",images:[],date:today()};openModal({type:"news-form"});break;
    case "edit-work":var w=find("works",id);if(w){ui.draft=clone(w);ui.draft.images=ui.draft.images||[];openModal({type:"work-form"});}break;
    case "edit-news":var n=find("news",id);if(n){ui.draft=clone(n);ui.draft.images=ui.draft.images||[];openModal({type:"news-form"});}break;
    case "edit-about":ui.draft=clone(state.about);openModal({type:"about-form"});break;
    case "del-work":case "del-news":var it=find(a==="del-work"?"works":"news",id);if(it)openModal({type:"confirm",title:"حذف «"+it.title+"»؟",text:"سيختفي من الموقع لكل الزوار.",col:a==="del-work"?"works":"news",id:id});break;
    case "clear-examples":openModal({type:"confirm",title:"حذف كل الأمثلة؟",text:"ستُحذف الأعمال والأخبار التجريبية، ويبقى ما أضفته أنت.",col:"examples"});break;
    case "confirm-yes":var m=ui.modal,next=clone(state);
      if(m.col==="examples"){next.works=next.works.filter(function(x){return !x.example;});next.news=next.news.filter(function(x){return !x.example;});save(next,"حُذفت الأمثلة");}
      else{next[m.col]=next[m.col].filter(function(x){return x.id!==m.id;});save(next,"تم الحذف");}break;
    case "rm-img":readForm();ui.draft.images.splice(+el.dataset.i,1);render();break;
  }
});
function blankWork(){return {title:"",student:"",grade:"",field:"phy",summary:"",description:"",images:[],video:"",date:today(),home:false,materials:[]};}
function persistAdmin(){try{if(ui.admin&&ui.pin)sessionStorage.setItem("dh-pin",ui.pin);else sessionStorage.removeItem("dh-pin");}catch(e){}}
function logout(){ui.admin=false;ui.pin="";persistAdmin();ui.modal=null;ui.draft=null;render();}
app.addEventListener("submit",function(e){e.preventDefault();if(e.target.id==="login-form")tryLogin();else if(e.target.id==="ai-form"){askHere();}else if(e.target.id==="lab-form"){labGo();}else submit();});
function updateAi(){var box=document.getElementById("ai-results");if(box)box.innerHTML=aiResults();}
app.addEventListener("input",function(e){if(e.target.id==="lab-q"&&ui.lab){ui.lab.topic=e.target.value;}
  if(e.target.id==="ai-q"){ui.aiq=e.target.value;if(ui.aiAns&&!ui.aiAns.loading)ui.aiAns=null;updateAi();}});
app.addEventListener("change",function(e){if(e.target.id==="ai-simple"){ui.aiSimple=e.target.checked;updateAi();}if(e.target.id==="ws-key"&&ui.lab){ui.lab.withKey=e.target.checked;updateLab();}if(e.target.id==="lab-file"&&e.target.files&&e.target.files[0]){labFile(e.target.files[0]);e.target.value="";}});
app.addEventListener("keydown",function(e){if(e.target.id==="ai-q"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();askHere();}});
app.addEventListener("change",function(e){if(e.target.id==="f-images"&&e.target.files.length)addFiles(e.target.files);if(e.target.id==="f-vfile"&&e.target.files.length)addVideo(e.target.files[0],e.target.dataset.field);});
app.addEventListener("change",function(e){if(e.target.id==="f-video"||(e.target.id==="f-url"&&ui.draft&&ui.draft.kind==="video")){readForm();render();}});
app.addEventListener("input",function(e){if(e.target.id==="q"){ui.q=e.target.value;var l=document.getElementById("works-list");if(l)l.innerHTML=worksList();}});
app.addEventListener("dragover",function(e){var d=e.target.closest(".drop");if(d){e.preventDefault();d.classList.add("over");}});
app.addEventListener("dragleave",function(e){var d=e.target.closest(".drop");if(d)d.classList.remove("over");});
app.addEventListener("drop",function(e){var d=e.target.closest(".drop");if(d){e.preventDefault();var inp=d.querySelector("input[type=file]");if(inp&&inp.id==="f-vfile"){if(e.dataTransfer.files[0])addVideo(e.dataTransfer.files[0],inp.dataset.field);}else addFiles(e.dataTransfer.files);}});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&ui.modal&&!ui.busy&&!ui.up)closeModal();});
window.addEventListener("beforeunload",function(e){if(ui.up||ui.busy){e.preventDefault();e.returnValue="";}});

/* ---------- boot ---------- */
route();
try{var fl=sessionStorage.getItem("dh-flash");if(fl){sessionStorage.removeItem("dh-flash");toast(fl);}}catch(e){}
function valid(d){return d&&typeof d.about==="object"&&Array.isArray(d.works)&&Array.isArray(d.news);}
function loadContent(){
  var local=null;try{local=JSON.parse(localStorage.getItem("dh-last")||"null");}catch(e){}
  function getList(kind){return fetch("https://res.cloudinary.com/"+CLOUD_NAME+"/"+kind+"/list/"+CONTENT_TAG+".json?t="+Date.now()).then(function(r){
    if(r.status===404)return {resources:[]};
    if(!r.ok)throw {code:"list",status:r.status};
    return r.json();});}
  return getList("raw").catch(function(e){return getList("any").catch(function(){throw e;});}).then(function(j){
    if((j.resources||[]).length)return j;
    return getList("any").catch(function(){return j;});
  }).then(function(j){
    var list=(j.resources||[]).slice().sort(function(a,b){return String(b.created_at).localeCompare(String(a.created_at));});
    function tryAt(k){
      if(k>=list.length||k>8)return Promise.resolve(null);
      var it=list[k];if(it.resource_type&&it.resource_type!=="raw")return tryAt(k+1);
      var u="https://res.cloudinary.com/"+CLOUD_NAME+"/raw/upload/v"+it.version+"/"+it.public_id;
      return fetch(u).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}).then(function(d){return valid(d)?d:tryAt(k+1);});
    }
    return tryAt(0);
  }).then(function(d){
    if(valid(local)&&(!d||(local.savedAt||0)>(d.savedAt||0)))d=local;
    return d;
  });
}
loadContent().then(function(d){if(valid(d))state=d;ui.loading=false;render();})
  .catch(function(e){ui.loading=false;render();
    if(e&&e.code==="list"&&e.status===401)toast("فعّل «Resource list» في إعدادات Cloudinary (الخطوة ٢) ليظهر المحتوى.");
    else toast("تعذّر تحميل المحتوى. أعد تحميل الصفحة.");});
})();
</script>
